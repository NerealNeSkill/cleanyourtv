name: Build APK

# Builds the launcher and publishes the APK as the "aura-latest" pre-release, so it can be downloaded
# in a phone's browser and installed. Run it by hand (Actions tab, "Run workflow") or push to the AURA branch.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-sh0pel]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Build the release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Size
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB (the repo's CI gate is 576 KB)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aura-launcher
          path: launcher/app/build/outputs/apk/release/app-release.apk
      - name: Publish pre-release aura-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk aura-launcher.apk
          gh release delete aura-latest --cleanup-tag --yes || true
          gh release create aura-latest aura-launcher.apk --prerelease --target "$GITHUB_SHA" \
            --title "AURA launcher (latest build)" --notes "Debug-signed APK of commit $GITHUB_SHA. Install over ADB or sideload."
